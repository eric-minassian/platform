# Publishes the public packages whose version isn't on npm yet (pnpm skips the
# rest), with trusted publishing (OIDC, no NPM_TOKEN) and provenance. One-time:
# add this workflow as a trusted publisher that allows `npm publish` for each
# package (docs/SETUP.md step 10).
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm (corepack)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
      - name: Publish new versions
        run: pnpm -r --filter './packages/*' publish --provenance --no-git-checks
