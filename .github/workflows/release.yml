# Publishes the four public packages to npm with trusted publishing (OIDC, no
# NPM_TOKEN) and provenance. One-time: add this workflow as a trusted publisher
# for each package on npmjs.com (see docs/SETUP.md).
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm (corepack)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks
