# Deploys the platform itself (the platform-foundation CDK stack, then the
# control plane) after CI passes on main. Uses the `platform-ci` role, trusted
# only for this repo's main branch (no GitHub environment here: that would
# change the OIDC subject the role trusts). Account-specific values live in
# repository variables, not in this public repo.
name: deploy-platform

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/platform/platform-ci
          aws-region: us-east-1
      - name: Diff the foundation stack
        env:
          DNS_DELEGATION_ROLE_ARN: ${{ vars.DNS_DELEGATION_ROLE_ARN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: pnpm platform:diff
      - name: Deploy the platform
        env:
          DNS_DELEGATION_ROLE_ARN: ${{ vars.DNS_DELEGATION_ROLE_ARN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: pnpm platform:deploy
